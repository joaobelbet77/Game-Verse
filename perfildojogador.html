<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerVerse | Perfil do Jogador</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --primary: #9333ea;
      --primary-accent: #3b82f6;
      --text: #ffffff;
      --text-secondary: #94a3b8;
      --border: #2a3241;
      --success: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    /* Estilos do Cabeçalho e SVG */
    .navbar .logo-svg-container { display: flex; align-items: center; text-decoration: none; cursor: pointer; }
    .navbar .logo-svg-container svg { height: 48px; width: auto; transition: transform 0.3s ease; }
    .navbar .logo-svg-container:hover svg { transform: scale(1.03); }

    .header-actions { display: flex; align-items: center; gap: 20px; }
    .user-icon { display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 1.2rem; transition: transform 0.2s ease, color 0.2s ease; }
    .user-icon:hover { color: #A855F7; transform: scale(1.1); }

    /* Content Layout */
    .profile-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; width: 100%; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }

    /* Card Lateral do Usuário */
    .profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px 20px; text-align: center; height: fit-content; }
    .avatar-wrapper { width: 100px; height: 100px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid var(--primary-accent); overflow: hidden; background: #0f131a; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary-accent); }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .user-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 4px; color: #fff; }
    .user-email { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 12px; word-break: break-all; }
    .user-tag { display: inline-block; background: rgba(59, 130, 246, 0.15); color: var(--primary-accent); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; }

    .user-stats { display: flex; justify-content: space-around; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 0; margin-bottom: 20px; }
    .stat-box { text-align: center; }
    .stat-number { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }

    .btn-logout { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); color: #e74c3c; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-logout:hover { background: rgba(231, 76, 60, 0.1); border-color: #e74c3c; }

    /* Painel dos Jogos Ativos */
    .main-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .section-header h2 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }

    /* Grid de Jogos no Perfil */
    .active-games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .active-game-card { background: #0f131a; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
    .active-game-card:hover { transform: translateY(-4px); border-color: var(--primary-accent); }

    .game-thumb { width: 100%; height: 130px; object-fit: cover; }
    .game-details { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .game-title { font-size: 1rem; font-weight: bold; margin-bottom: 4px; color: #fff; }
    .game-platform { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }
    
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--success); font-weight: 600; background: rgba(46, 204, 113, 0.1); padding: 4px 8px; border-radius: 4px; width: fit-content; margin-top: auto; }
    .status-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); grid-column: 1 / -1; }
    .empty-state p { margin-bottom: 16px; }
    .btn-action { display: inline-block; padding: 10px 18px; background: linear-gradient(135deg, var(--primary-accent), var(--primary)); color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }

    @media (max-width: 850px) {
      .profile-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo-svg-container">
      <svg width="220" height="50" viewBox="0 0 220 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="22" cy="24" rx="20" ry="8" stroke="url(#grad2)" stroke-width="2.5" transform="rotate(-25 22 24)" />
        <path d="M11 16C9.34315 16 8 17.3431 8 19V25C8 27.7614 10.2386 30 13 30C14.882 30 16.5204 28.9602 17.3753 27.4262L19.1056 24.3115C19.6833 23.2717 20.7828 22.625 21 22.625C21.2172 22.625 22.3167 23.2717 22.8944 24.3115L24.6247 27.4262C25.4796 28.9602 27.118 30 29 30C31.7614 30 34 27.7614 34 25V19C34 17.3431 32.6569 16 31 16H11Z" fill="url(#grad1)"/>
        <path d="M13 19V23M11 21H15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="28" cy="20" r="1.2" fill="#FFFFFF"/>
        <circle cx="30.5" cy="22.5" r="1.2" fill="#FFFFFF"/>
        <circle cx="28" cy="25" r="1.2" fill="#FFFFFF"/>
        <circle cx="25.5" cy="22.5" r="1.2" fill="#FFFFFF"/>
        <text x="52" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="0.5">
          Game<tspan fill="#A855F7">Verse</tspan>
        </text>
        <defs>
          <linearGradient id="grad1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#9333EA" />
          </linearGradient>
          <linearGradient id="grad2" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#06B6D4" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
        </defs>
      </svg>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="biblioteca.html">Minha Biblioteca</a></li>
        <li><a href="resgatar.html">Resgatar Código</a></li>
        <li><a href="perfil.html" class="active">Meu Perfil</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="perfil.html" class="user-icon" title="Meu Perfil">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      
      <div class="cart-icon">
        <a href="Carrinhodecompra.html" title="Carrinho">🛒</a>
        <span class="cart-count" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <main class="profile-container">
    <!-- Card do Usuário Logado -->
    <aside class="profile-card">
      <div class="avatar-wrapper" id="avatar-container">
        👤
      </div>
      <div class="user-name" id="profile-name">Jogador GamerVerse</div>
      <div class="user-email" id="profile-email">usuario@gamerverse.com</div>
      <div class="user-tag">Membro Verificado</div>

      <div class="user-stats">
        <div class="stat-box">
          <div class="stat-number" id="count-jogos">0</div>
          <div class="stat-label">Jogos</div>
        </div>
        <div class="stat-box">
          <div class="stat-number">Ativa</div>
          <div class="stat-label">Conta</div>
        </div>
      </div>

      <button class="btn-logout" onclick="encerrarSessao()">Sair da Conta</button>
    </aside>

    <!-- Jogos Ativos na Conta -->
    <section class="main-content">
      <div class="section-header">
        <h2>🎮 Jogos Ativos no Perfil</h2>
      </div>

      <div class="active-games-grid" id="active-games-grid">
        <!-- Jogos serão adicionados dinamicamente via JS -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 GamerVerse. Desenvolvido para Gamers.</p>
  </footer>

  <script>
    function carregarDadosUsuario() {
      // Tenta buscar o usuário salvo no localStorage (criado no login/cadastro)
      const usuarioLogado = JSON.parse(localStorage.getItem('usuarioGamerVerse')) || {
        nome: "Alex Gamer",
        email: "alex.gamer@gamerverse.com"
      };

      document.getElementById('profile-name').textContent = usuarioLogado.nome;
      document.getElementById('profile-email').textContent = usuarioLogado.email;
    }

    function carregarJogosPerfil() {
      const grid = document.getElementById('active-games-grid');
      const countDisplay = document.getElementById('count-jogos');

      // Recupera as chaves ativadas do localStorage
      const chavesAtivas = JSON.parse(localStorage.getItem('keysResgatadasGamerVerse')) || [];

      countDisplay.textContent = chavesAtivas.length;

      if (chavesAtivas.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>Você ainda não possui nenhum jogo ativo atrelado ao seu perfil.</p>
            <a href="resgatar.html" class="btn-action">Ativar Código de Jogo</a>
          </div>
        `;
        return;
      }

      const catalogoJogos = [
        { titulo: "Cyberpunk 2077", plataforma: "PC Digital", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300" },
        { titulo: "Elden Ring", plataforma: "PC / Steam", img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300" },
        { titulo: "God of War Ragnarök", plataforma: "PlayStation 5", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300" },
        { titulo: "Starfield", plataforma: "PC / Xbox", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300" }
      ];

      grid.innerHTML = '';

      chavesAtivas.forEach((key, index) => {
        const jogo = catalogoJogos[index % catalogoJogos.length];

        const gameCardHTML = `
          <div class="active-game-card">
            <img src="${jogo.img}" alt="${jogo.titulo}" class="game-thumb">
            <div class="game-details">
              <div class="game-title">${jogo.titulo}</div>
              <div class="game-platform">${jogo.plataforma}</div>
              <div class="status-badge">
                <span class="status-dot"></span> Ativo no Perfil
              </div>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', gameCardHTML);
      });
    }

    function encerrarSessao() {
      if (confirm("Deseja realmente sair da sua conta?")) {
        localStorage.removeItem('usuarioGamerVerse');
        window.location.href = "Paginalogin.html";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      carregarDadosUsuario();
      carregarJogosPerfil();

      const carrinho = JSON.parse(localStorage.getItem('carrinhoGamerVerse')) || [];
      const cartCountHeader = document.getElementById('cart-count');
      if (cartCountHeader) {
        cartCountHeader.textContent = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
      }
    });
  </script>

</body>
</html>
