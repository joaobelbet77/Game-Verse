<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerVerse | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Gamer<span>Verse</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="lancamento.html">Lançamentos</a></li>
                <li><a href="promocoes.html">Promoções</a></li>
                <li><a href="Contato.html">Contato</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="login-card">
            <h2 class="section-title" style="margin-bottom: 20px;">Acesse sua Conta</h2>
            
            <!-- Mensagem de Feedback -->
            <div id="mensagem-alerta" class="alerta-box" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Seu e-mail cadastrado" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="lembrar"> Lembrar-me
                    </label>
                    <a href="Esqueceusenha.html" class="esqueci-senha">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-comprar btn-login">Entrar</button>
            </form>

            <div class="login-footer">
                <p>Não possui uma conta? <a href="Cadastrese.html">Cadastre-se</a></p>
                <p style="margin-top: 10px;">
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GamerVerse. Desenvolvido para Gamers.</p>
    </footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cartCountHeader = document.getElementById('cart-count');
        const loginForm = document.getElementById('login-form');
        const alertaBox = document.getElementById('mensagem-alerta');

        // Atualiza a quantidade do carrinho
        function atualizarContador() {
            const carrinho = JSON.parse(localStorage.getItem('carrinhoGamerVerse')) || [];
            const totalQtd = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
            if (cartCountHeader) cartCountHeader.textContent = totalQtd;
        }

        // Função para mostrar os avisos diretamente na TELA (sem pop-up)
        function exibirMensagem(texto, tipo = 'erro') {
            alertaBox.style.display = 'block';
            alertaBox.style.padding = '10px';
            alertaBox.style.marginBottom = '15px';
            alertaBox.style.borderRadius = '6px';
            alertaBox.style.textAlign = 'center';
            alertaBox.style.fontSize = '0.9rem';

            if (tipo === 'erro') {
                alertaBox.style.backgroundColor = '#e74c3c';
                alertaBox.style.color = '#fff';
            } else {
                alertaBox.style.backgroundColor = '#2ecc71';
                alertaBox.style.color = '#fff';
            }
            alertaBox.textContent = texto;
        }

        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const senha = document.getElementById('senha').value;

                // Busca usuários salvos no localStorage (criados no cadastro)
                const usuariosSalvos = JSON.parse(localStorage.getItem('usuariosGamerVerse')) || [];

                // Verifica se o usuário existe
                const usuarioEncontrado = usuariosSalvos.find(u => u.email === email && u.senha === senha);
                const eAdmin = (email === 'admin@gamerverse.com' && senha === '123456');

                if (usuarioEncontrado || eAdmin) {
                    exibirMensagem('Login efetuado com sucesso! Redirecionando...', 'sucesso');

                    // Salva a sessão no navegador
                    const dadosSessao = {
                        nome: usuarioEncontrado ? usuarioEncontrado.nome : 'Administrador',
                        email: email
                    };
                    localStorage.setItem('usuarioLogado', JSON.stringify(dadosSessao));

                    // Redireciona para o painel do administrador quando for admin
                    setTimeout(() => {
                        if (eAdmin) {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1200);
                } else {
                    // EXIBE NA TELA EM VEZ DE USAR ALERT()
                    exibirMensagem('E-mail ou senha incorretos.');
                }
            });
        }

        atualizarContador();
    });
</script>
</body>
</html>
