<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerVerse | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            margin-top: 0;
            color: #ffffff;
            border-left: 4px solid #00d8ff;
            padding-left: 10px;
        }

        .alerta-erro {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #1e293b;
            border-radius: 4px;
            background-color: #0b0e14;
            color: #fff;
            box-sizing: border-box;
        }

        .btn-entrar {
            width: 100%;
            padding: 12px;
            background-color: #00d8ff;
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-entrar:hover {
            background-color: #00b4d8;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <h2>Acesse sua Conta</h2>
            <p style="color: #94a3b8; font-size: 0.85rem;">🔒 Faça login para liberar a navegação por toda a loja.</p>

            <div id="alerta-erro" class="alerta-erro">E-mail ou senha incorretos.</div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="admin@gameverse.com" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="******" required>
                </div>
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const formLogin = document.getElementById('form-login');
        const alertaErro = document.getElementById('alerta-erro');

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value.trim();

            alertaErro.style.display = 'none';

            // 1. CREDENCIAIS DE ADMINISTRADOR
            // Permite admin@gameverse.com e admin@gamerverse.com
            const eAdminEmail = (email === 'admin@gameverse.com' || email === 'admin@gamerverse.com');
            const eAdminSenha = (senha === '123' || senha === '123456' || senha === 'admin');

            if (eAdminEmail && eAdminSenha) {
                const usuarioAdmin = {
                    nome: 'Administrador',
                    email: 'admin@gameverse.com' // Salva exatamente como o admin.html espera
                };
                localStorage.setItem('usuarioLogado', JSON.stringify(usuarioAdmin));
                window.location.href = 'admin.html';
                return;
            }

            // 2. CREDENCIAIS DE USUÁRIOS COMUNS CADASTRADOS
            const usuariosCadastrados = JSON.parse(localStorage.getItem('usuariosGamerVerse')) || [];
            const usuarioEncontrado = usuariosCadastrados.find(u => u.email.toLowerCase() === email && u.senha === senha);

            if (usuarioEncontrado) {
                const usuarioLogado = {
                    nome: usuarioEncontrado.nome,
                    email: usuarioEncontrado.email
                };
                localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
                window.location.href = 'index.html';
            } else {
                alertaErro.style.display = 'block';
            }
        });
    });
</script>
<script src="responsive.js"></script>
</body>
</html>
