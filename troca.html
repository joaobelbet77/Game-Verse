<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerVerse | Mercado da Comunidade (P2P)</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Proteção de Rota
        (function() {
            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
            if (!usuarioLogado || !usuarioLogado.email) {
                window.location.href = 'Paginalogin.html';
            }
        })();
    </script>
    <style>
        .p2p-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .p2p-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #151a23;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2a3241;
        }
        .p2p-header h2 { color: #fff; margin: 0; }
        .btn-anunciar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-anunciar:hover { transform: scale(1.05); }

        /* Grid de Anúncios */
        .grid-anuncios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card-p2p {
            background: #151a23;
            border: 1px solid #2a3241;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-p2p-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #a855f7;
            font-weight: bold;
        }
        .card-p2p h3 { color: #fff; margin: 0 0 8px 0; font-size: 1.1rem; }
        .card-p2p .detalhes { color: #94a3b8; font-size: 0.85rem; margin-bottom: 15px; }
        .card-p2p .preco-p2p {
            font-size: 1.3rem;
            color: #10b981;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-trocar {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Formulário de Anúncio */
        .modal-form {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-form-content {
            background: #151a23;
            border: 1px solid #2a3241;
            border-radius: 12px;
            padding: 25px;
            width: 90%; max-width: 450px;
        }
        .modal-form-content h3 { color: #fff; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; color: #94a3b8; margin-bottom: 5px; font-size: 0.85rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #2a3241; background: #0b0e14; color: #fff;
            box-sizing: border-box;
        }
        .modal-form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancelar { background: transparent; border: 1px solid #2a3241; color: #94a3b8; flex: 1; padding: 10px; border-radius: 6px; cursor: pointer; }
        .btn-salvar { background: #10b981; color: #fff; border: none; flex: 1; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo-svg-container">
            <span style="color: #fff; font-weight: 800; font-size: 1.4rem;">Game<span style="color: #A855F7;">Verse</span></span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="mercado.html" class="active">Feira de Trocas (P2P)</a></li>
                <li><a href="biblioteca.html">Minha Biblioteca</a></li>
            </ul>
        </nav>
    </header>

    <main class="p2p-container">
        <div class="p2p-header">
            <div>
                <h2>🔄 Feira de Trocas da Comunidade</h2>
                <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 0.9rem;">Compre e negocie chaves e jogos usáveis diretamente com outros jogadores.</p>
            </div>
            <button class="btn-anunciar" id="btn-abrir-modal">+ Criar Anúncio</button>
        </div>

        <div class="grid-anuncios" id="grid-anuncios">
            <!-- Anúncios serão carregados via JS -->
        </div>
    </main>

    <!-- MODAL PARA NOVO ANÚNCIO -->
    <div class="modal-form" id="modal-anuncio">
        <div class="modal-form-content">
            <h3>Anunciar Jogo para Troca/Venda</h3>
            <form id="form-novo-anuncio">
                <div class="form-group">
                    <label>Nome do Jogo</label>
                    <input type="text" id="jogo-nome" placeholder="Ex: Elden Ring" required>
                </div>
                <div class="form-group">
                    <label>Plataforma / Formato</label>
                    <select id="jogo-plataforma">
                        <option value="PC (Chave Steam)">PC (Chave Steam)</option>
                        <option value="PS5 (Mídia Física)">PS5 (Mídia Física)</option>
                        <option value="Xbox Series (Código Digital)">Xbox Series (Código Digital)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Preço Sugerido (R$)</label>
                    <input type="number" id="jogo-preco" step="0.01" placeholder="120.00" required>
                </div>
                <div class="modal-form-actions">
                    <button type="button" class="btn-cancelar" id="btn-fechar-modal">Cancelar</button>
                    <button type="submit" class="btn-salvar">Publicar Anúncio</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('modal-anuncio');
            const btnAbrir = document.getElementById('btn-abrir-modal');
            const btnFechar = document.getElementById('btn-fechar-modal');
            const form = document.getElementById('form-novo-anuncio');
            const grid = document.getElementById('grid-anuncios');

            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado')) || { nome: 'Anônimo' };

            // Dados iniciais de demonstração (se o storage estiver vazio)
            let ofertas = JSON.parse(localStorage.getItem('p2p_ofertas')) || [
                { id: 1, usuario: "LucasGamer", jogo: "Cyberpunk 2077", plataforma: "PC (Chave Steam)", preco: 89.90 },
                { id: 2, usuario: "Beatriz_PS5", jogo: "Demon's Souls", plataforma: "PS5 (Mídia Física)", preco: 140.00 }
            ];

            function salvarERenderizar() {
                localStorage.setItem('p2p_ofertas', JSON.stringify(ofertas));
                grid.innerHTML = '';

                if (ofertas.length === 0) {
                    grid.innerHTML = '<p style="color: #94a3b8;">Nenhum anúncio ativo no momento. Seja o primeiro a criar um!</p>';
                    return;
                }

                ofertas.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card-p2p';
                    card.innerHTML = `
                        <div>
                            <div class="card-p2p-user">👤 Vendedor: ${item.usuario}</div>
                            <h3>${item.jogo}</h3>
                            <div class="detalhes">🎮 ${item.plataforma}</div>
                        </div>
                        <div>
                            <div class="preco-p2p">R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}</div>
                            <button class="btn-trocar" onclick="comprarTroca(${item.id})">Propor Troca / Comprar</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            // Abertura e Fechamento do Modal
            btnAbrir.addEventListener('click', () => modal.style.display = 'flex');
            btnFechar.addEventListener('click', () => modal.style.display = 'none');

            // Formulário de Criação de Anúncio
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const novoItem = {
                    id: Date.now(),
                    usuario: usuarioLogado.nome ? usuarioLogado.nome.split(' ')[0] : 'Usuário',
                    jogo: document.getElementById('jogo-nome').value,
                    plataforma: document.getElementById('jogo-plataforma').value,
                    preco: parseFloat(document.getElementById('jogo-preco').value)
                };

                ofertas.unshift(novoItem);
                salvarERenderizar();
                form.reset();
                modal.style.display = 'none';
            });

            // Ação de simulação de compra/troca
            window.comprarTroca = function(id) {
                const item = ofertas.find(o => o.id === id);
                if (item) {
                    alert(`Solicitação enviada para ${item.usuario}! Um chat virtual P2P para negociação do item "${item.jogo}" foi iniciado.`);
                }
            };

            salvarERenderizar();
        });
    </script>
</body>
</html>
