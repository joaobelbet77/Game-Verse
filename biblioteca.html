<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerVerse | Minha Biblioteca</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --primary: #0088ff;
      --primary-hover: #0066cc;
      --text: #ffffff;
      --text-secondary: #94a3b8;
      --border: #2a3241;
      --success: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    /* Navbar */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--text); }
    .logo span { color: var(--primary); }
    nav ul { display: flex; list-style: none; gap: 20px; }
    nav a { color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: 0.2s; }
    nav a:hover, nav a.active { color: var(--text); }

    /* Main Content */
    .container { flex: 1; padding: 40px 8%; max-width: 1200px; margin: 0 auto; width: 100%; }
    .header-section { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .header-section h2 { font-size: 1.8rem; }
    .header-section p { color: var(--text-secondary); font-size: 0.95rem; }

    /* Grid de Jogos */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .game-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
    .game-card:hover { transform: translateY(-5px); border-color: var(--primary); }

    .game-cover { width: 100%; height: 160px; object-fit: cover; background: #0f131a; }
    .game-info { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .game-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .game-platform { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .key-display { background: #0f131a; border: 1px dashed var(--border); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: var(--primary); text-align: center; margin-bottom: 14px; word-break: break-all; }

    .btn-download { width: 100%; padding: 10px; background: var(--primary); border: none; color: #fff; font-weight: bold; font-size: 0.9rem; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: auto; }
    .btn-download:hover { background: var(--primary-hover); }

    .empty-library { text-align: center; padding: 60px 20px; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 12px; grid-column: 1 / -1; }
    .empty-library p { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 16px; }
    .btn-shop { display: inline-block; padding: 10px 20px; background: var(--primary); color: #fff; text-decoration: none; font-weight: bold; border-radius: 6px; }

    /* Toast Notification */
    .toast { position: fixed; bottom: 20px; right: 20px; background: #151a23; border: 1px solid var(--primary); color: #fff; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; z-index: 1000; }

    /* Footer */
    footer { text-align: center; padding: 20px; background: var(--card-bg); border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 0.85rem; margin-top: 40px; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">Game<span>Verse</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="Carrinhodecompra.html">Carrinho</a></li>
        <li><a href="resgatar.html">Resgatar Código</a></li>
        <li><a href="biblioteca.html" class="active">Minha Biblioteca</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="header-section">
      <div>
        <h2>Minha Coleção</h2>
        <p>Acesse suas chaves ativadas e gerencie seus jogos da conta.</p>
      </div>
      <a href="resgatar.html" class="btn-shop" style="background: transparent; border: 1px solid var(--border);">+ Resgatar Novo Código</a>
    </div>

    <div class="games-grid" id="library-grid">
      <!-- Jogos inseridos via JS -->
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <footer>
    <p>&copy; 2026 GamerVerse. Desenvolvido para Gamers.</p>
  </footer>

  <script>
    function showToast(mensagem) {
      const toast = document.getElementById('toast');
      toast.textContent = mensagem;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function carregarBiblioteca() {
      const grid = document.getElementById('library-grid');
      
      // Lê as chaves ativadas do localStorage
      const chavesResgatadas = JSON.parse(localStorage.getItem('keysResgatadasGamerVerse')) || [];

      if (chavesResgatadas.length === 0) {
        grid.innerHTML = `
          <div class="empty-library">
            <p>Sua biblioteca está vazia no momento 🎮</p>
            <a href="index.html" class="btn-shop">Ir para a Loja</a>
          </div>
        `;
        return;
      }

      // Lista de jogos simulados para mapear as chaves resgatadas
      const jogosBase = [
        { titulo: "Cyberpunk 2077", plataforma: "PC Digital", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqTsF9Ay_oTNHUgHCLtU562R4oc-ZwOAXdrPucozl4MPkhNUmFtv_ZMwIRtXmmd6p38rBmF7GUcR3y9zwmKIqDl_CVVdHyBQw0k51mJw&s=10" },
        { titulo: "Elden Ring", plataforma: "PC / Steam", img: "https://via.placeholder.com/300x160/0f131a/0088ff?text=Elden+Ring" },
        { titulo: "God of War Ragnarök", plataforma: "PlayStation 5", img: "https://via.placeholder.com/300x160/0f131a/0088ff?text=God+of+War" },
        { titulo: "Starfield", plataforma: "PC / Xbox", img: "https://via.placeholder.com/300x160/0f131a/0088ff?text=Starfield" }
      ];

      grid.innerHTML = '';

      chavesResgatadas.forEach((key, index) => {
        // Seleciona um jogo com base no índice da chave
        const jogo = jogosBase[index % jogosBase.length];

        const cardHTML = `
          <div class="game-card">
            <img src="${jogo.img}" alt="${jogo.titulo}" class="game-cover">
            <div class="game-info">
              <div class="game-title">${jogo.titulo}</div>
              <div class="game-platform">${jogo.plataforma}</div>
              <div class="key-display" title="Sua chave de produto">${key}</div>
              <button class="btn-download" onclick="copiarKey('${key}')">Copiar Key</button>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    function copiarKey(key) {
      navigator.clipboard.writeText(key);
      showToast("Chave do jogo copiada para a área de transferência!");
    }

    // Carrega os jogos assim que a página abre
    window.onload = carregarBiblioteca;
  </script>

</body>
</html>
